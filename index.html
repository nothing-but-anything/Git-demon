<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 字符编码：必须加，避免中文乱码 -->
    <meta charset="UTF-8">
    <!-- 移动端适配：让页面在手机上正常显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 页面标题：替换成你的项目名称 -->
    <title>我的HTML页面</title>
    <!-- 可选：引入CSS文件/写内部样式 -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* 这里可以写页面样式 */
        body {
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }
    </style>
</head>
<body>
    <!-- 页面内容写在这里 -->
    <h1>Hello World!</h1>
    
    <!-- 可选：引入JS文件/写内部脚本 -->
    <script src="script.js"></script>
    <script>
        // 这里可以写JavaScript代码
        console.log("页面加载完成");
    </script>
</body>
</html>
